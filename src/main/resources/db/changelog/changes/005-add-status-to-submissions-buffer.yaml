databaseChangeLog:
  - changeSet:
      id: 005-add-status-to-submissions-buffer
      author: system
      comment: "Add status column to submissions_buffer table"
      changes:
        - addColumn:
            tableName: submissions_buffer
            columns:
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'PENDING'
                  constraints:
                    nullable: false
