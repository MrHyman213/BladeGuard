databaseChangeLog:
  - changeSet:
      id: 006-create-knife-models-tables
      author: system
      changes:
        # Создаем таблицу для хранения уникальных названий ножей
        - createTable:
            tableName: knife_models
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: normalized_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        
        # Создаем индекс для быстрого поиска по нормализованному имени
        - createIndex:
            indexName: idx_knife_models_normalized_name
            tableName: knife_models
            columns:
              - column:
                  name: normalized_name
        
        # Создаем связующую таблицу для отношения многие-ко-многим
        - createTable:
            tableName: submission_models
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: submission_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: knife_model_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        
        # Добавляем внешние ключи
        - addForeignKeyConstraint:
            baseTableName: submission_models
            baseColumnNames: submission_id
            constraintName: fk_submission_models_submission
            referencedTableName: submissions
            referencedColumnNames: id
            onDelete: CASCADE
        
        - addForeignKeyConstraint:
            baseTableName: submission_models
            baseColumnNames: knife_model_id
            constraintName: fk_submission_models_knife_model
            referencedTableName: knife_models
            referencedColumnNames: id
            onDelete: CASCADE
        
        # Создаем уникальный индекс для предотвращения дублирования связей
        - createIndex:
            indexName: idx_submission_models_unique
            tableName: submission_models
            unique: true
            columns:
              - column:
                  name: submission_id
              - column:
                  name: knife_model_id
        
        # Создаем индекс для быстрого поиска по knife_model_id
        - createIndex:
            indexName: idx_submission_models_knife_model_id
            tableName: submission_models
            columns:
              - column:
                  name: knife_model_id
        
        # Мигрируем существующие данные из submissions
        # Создаем записи knife_models из существующих name
        - sql:
            sql: |
              INSERT INTO knife_models (name, normalized_name)
              SELECT DISTINCT 
                TRIM(name) as name,
                LOWER(TRIM(REGEXP_REPLACE(name, '\s+', ' ', 'g'))) as normalized_name
              FROM submissions 
              WHERE name IS NOT NULL AND TRIM(name) != ''
              ON CONFLICT (name) DO NOTHING;
        
        # Связываем существующие submissions с knife_models (основная модель)
        - sql:
            sql: |
              INSERT INTO submission_models (submission_id, knife_model_id, is_primary)
              SELECT s.id, km.id, true
              FROM submissions s
              INNER JOIN knife_models km ON TRIM(s.name) = km.name
              WHERE s.name IS NOT NULL AND TRIM(s.name) != '';
        
        # Парсим и добавляем альтернативные модели из alternative_models
        - sql:
            sql: |
              WITH parsed_alternatives AS (
                SELECT 
                  s.id as submission_id,
                  TRIM(alt.value) as alt_name
                FROM submissions s,
                LATERAL string_to_table(s.alternative_models, ',') AS alt(value)
                WHERE s.alternative_models IS NOT NULL 
                  AND TRIM(s.alternative_models) != ''
                  AND TRIM(alt.value) != ''
              ),
              inserted_models AS (
                INSERT INTO knife_models (name, normalized_name)
                SELECT DISTINCT 
                  alt_name,
                  LOWER(TRIM(REGEXP_REPLACE(alt_name, '\s+', ' ', 'g')))
                FROM parsed_alternatives
                ON CONFLICT (name) DO NOTHING
                RETURNING id, name
              )
              INSERT INTO submission_models (submission_id, knife_model_id, is_primary)
              SELECT DISTINCT
                pa.submission_id,
                COALESCE(im.id, km.id),
                false
              FROM parsed_alternatives pa
              LEFT JOIN inserted_models im ON im.name = pa.alt_name
              LEFT JOIN knife_models km ON km.name = pa.alt_name
              WHERE COALESCE(im.id, km.id) IS NOT NULL
              ON CONFLICT DO NOTHING;
