databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: system
      comment: "Initial schema — clean state based on target architecture"
      changes:

        # ── brands ──────────────────────────────────────────────────────────
        - createTable:
            tableName: brands
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
                    unique: true

        # ── knife_models ─────────────────────────────────────────────────────
        - createTable:
            tableName: knife_models
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        # ── knives ───────────────────────────────────────────────────────────
        - createTable:
            tableName: knives
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: model_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: brand_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: idx
                  type: VARCHAR(100)
              - column:
                  name: photo_path
                  type: VARCHAR(512)

        # ── alternatives ─────────────────────────────────────────────────────
        - createTable:
            tableName: alternatives
            columns:
              - column:
                  name: knife_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: alternative_knife_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: alternatives
            columnNames: knife_id, alternative_knife_id
            constraintName: pk_alternatives

        # ── submissions_buffer ───────────────────────────────────────────────
        # Нет колонки status. Альтернативы хранятся строкой в колонке alternatives.
        - createTable:
            tableName: submissions_buffer
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
              - column:
                  name: model_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: brand_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: idx
                  type: VARCHAR(100)
              - column:
                  name: photo_path
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: alternatives
                  type: TEXT

        # ── user_main_menu ───────────────────────────────────────────────────
        - createTable:
            tableName: user_main_menu
            columns:
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: INTEGER
                  constraints:
                    nullable: false

        # ── Foreign keys ─────────────────────────────────────────────────────
        - addForeignKeyConstraint:
            baseTableName: knives
            baseColumnNames: model_id
            constraintName: fk_knives_model
            referencedTableName: knife_models
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: knives
            baseColumnNames: brand_id
            constraintName: fk_knives_brand
            referencedTableName: brands
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: alternatives
            baseColumnNames: knife_id
            constraintName: fk_alternatives_knife
            referencedTableName: knives
            referencedColumnNames: id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: alternatives
            baseColumnNames: alternative_knife_id
            constraintName: fk_alternatives_alt_knife
            referencedTableName: knives
            referencedColumnNames: id
            onDelete: CASCADE

        # ── Indexes ──────────────────────────────────────────────────────────
        - createIndex:
            tableName: submissions_buffer
            indexName: idx_submissions_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: submissions_buffer
            indexName: idx_submissions_created_at
            columns:
              - column:
                  name: created_at

        - createIndex:
            tableName: knives
            indexName: idx_knives_model_brand
            columns:
              - column:
                  name: model_id
              - column:
                  name: brand_id

  # ── DB trigger: auto-delete orphan knife_models ──────────────────────────
  - changeSet:
      id: 001-auto-delete-trigger
      author: system
      comment: "Trigger to auto-delete knife_models with no photo and no alternatives"
      dbms: postgresql
      changes:
        - sql:
            splitStatements: false
            sql: |
              CREATE OR REPLACE FUNCTION cleanup_orphan_knife_models()
              RETURNS TRIGGER AS $$
              BEGIN
                DELETE FROM knife_models km
                WHERE km.id IN (OLD.knife_id, OLD.alternative_knife_id)
                  AND NOT EXISTS (
                    SELECT 1 FROM knives k
                    WHERE k.model_id = km.id AND k.photo_path IS NOT NULL
                  )
                  AND NOT EXISTS (
                    SELECT 1 FROM alternatives a
                    WHERE a.knife_id IN (SELECT id FROM knives WHERE model_id = km.id)
                       OR a.alternative_knife_id IN (SELECT id FROM knives WHERE model_id = km.id)
                  );
                RETURN OLD;
              END;
              $$ LANGUAGE plpgsql;
              
              CREATE TRIGGER trg_cleanup_orphan_models
              AFTER DELETE ON alternatives
              FOR EACH ROW EXECUTE FUNCTION cleanup_orphan_knife_models();
