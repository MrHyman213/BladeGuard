databaseChangeLog:
  - changeSet:
      id: 002-1-drop-submission-alternatives-table
      author: kiro
      changes:
        - dropTable:
            tableName: submission_alternatives
            cascadeConstraints: true
      rollback:
        - createTable:
            tableName: submission_alternatives
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: submission_id
                  type: BIGINT
              - column:
                  name: alternative_id
                  type: BIGINT

  - changeSet:
      id: 002-2-drop-pending-alternatives-table
      author: kiro
      changes:
        - dropTable:
            tableName: pending_alternatives
            cascadeConstraints: true

  - changeSet:
      id: 002-3-drop-moderation-sessions-table
      author: kiro
      changes:
        - dropTable:
            tableName: moderation_sessions
            cascadeConstraints: true

  - changeSet:
      id: 002-4-drop-bot-settings-table
      author: kiro
      changes:
        - dropTable:
            tableName: bot_settings
            cascadeConstraints: true

  - changeSet:
      id: 002-5-drop-rejection-reason-column
      author: kiro
      changes:
        - dropColumn:
            tableName: submissions
            columnName: rejection_reason
