databaseChangeLog:
  - changeSet:
      id: 007-create-certificate-alternatives
      author: system
      changes:
        # Создаем таблицу для хранения связей между сертификатами (альтернативы)
        - createTable:
            tableName: certificate_alternatives
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: certificate_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: alternative_certificate_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        
        # Добавляем внешние ключи
        - addForeignKeyConstraint:
            baseTableName: certificate_alternatives
            baseColumnNames: certificate_id
            constraintName: fk_cert_alt_certificate
            referencedTableName: submissions
            referencedColumnNames: id
            onDelete: CASCADE
        
        - addForeignKeyConstraint:
            baseTableName: certificate_alternatives
            baseColumnNames: alternative_certificate_id
            constraintName: fk_cert_alt_alternative
            referencedTableName: submissions
            referencedColumnNames: id
            onDelete: CASCADE
        
        # Создаем уникальный индекс для предотвращения дублирования связей
        - createIndex:
            indexName: idx_cert_alt_unique
            tableName: certificate_alternatives
            unique: true
            columns:
              - column:
                  name: certificate_id
              - column:
                  name: alternative_certificate_id
        
        # Создаем индекс для быстрого поиска альтернатив
        - createIndex:
            indexName: idx_cert_alt_certificate_id
            tableName: certificate_alternatives
            columns:
              - column:
                  name: certificate_id
        
        # Создаем индекс для обратного поиска (какие сертификаты ссылаются на данный)
        - createIndex:
            indexName: idx_cert_alt_alternative_id
            tableName: certificate_alternatives
            columns:
              - column:
                  name: alternative_certificate_id
