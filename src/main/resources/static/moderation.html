<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование заявки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/css/moderation.css">
</head>
<body>
    <div id="app">
        <div class="photo-container">
            <img id="photo" src="" alt="Certificate Photo">
        </div>
        
        <div class="form-group">
            <label for="modelName">Название модели</label>
            <input type="text" id="modelName" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="description">Описание</label>
            <textarea id="description" class="form-control" rows="5"></textarea>
        </div>
        
        <div class="form-group">
            <label>Альтернативные модели</label>
            <div id="alternativeModels"></div>
            <button id="addModel" class="btn-secondary">+ Добавить модель</button>
        </div>
        
        <div class="button-group">
            <button id="saveAndApprove" class="btn-primary">✅ Сохранить и одобрить</button>
            <button id="saveDraft" class="btn-secondary">💾 Сохранить черновик</button>
            <button id="reject" class="btn-danger">❌ Отклонить</button>
        </div>
    </div>
    
    <script src="/js/moderation.js"></script>
</body>
</html>
